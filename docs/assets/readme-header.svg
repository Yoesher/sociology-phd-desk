<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="280" viewBox="0 0 1400 280" role="img" aria-labelledby="title description">
  <title id="title">Sociology PhD Desk — a place for your research</title>
  <desc id="description">An ivory and teal academic desk illustration for the local-first, bilingual research workstation. Books, field notes, analysis and writing are connected in a simple diagram, not an application screenshot.</desc>
