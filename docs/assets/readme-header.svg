  <path d="M28 28H1372V252H28Z" fill="none" stroke="#dfd6c6"/>
  <rect x="64" y="62" width="46" height="4" rx="2" fill="#ac704f"/>
  <text x="64" y="111" fill="#173b41" font-family="Georgia, 'Times New Roman', serif" font-size="49">Sociology PhD Desk</text>
  <text x="66" y="153" fill="#57665f" font-family="system-ui, sans-serif" font-size="21">A place for your literature, fieldwork, analysis and writing.</text>
